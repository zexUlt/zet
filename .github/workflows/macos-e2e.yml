name: macos e2e

# The macOS client against the Linux agent, end to end (design.md §16).
#
# On macos-15-intel because the arm64 macOS runners cannot start a VM:
# Apple's Virtualization.framework does not nest there, so colima, and with
# it any Linux container, does not run. The Intel image can, and GitHub
# supports it until about August 2027 — this job has that expiry.
#
# The agent is built once, on Linux, where it is built anyway and ccache is
# warm, and handed to the macOS job as an artifact: building it inside colima
# on the Intel runner took six of the first run's 13.5 minutes. The macOS job
# starts colima in the background while it builds the client, the two
# longest things it does, and the host installs only what the tests run.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"
  # And on every pull request, so that `macos e2e` can be a required check;
  # the jobs skip when the change touches nothing on the path from the macOS
  # client to the agent (tools/ci_changes.sh).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      macos_e2e: ${{ steps.changes.outputs.macos_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes

  agent:
    name: build zet-agent
    needs: changes
    if: needs.changes.outputs.macos_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The same cache entry as the musl-dev jobs of ci.yml: the agent's
      # objects are theirs.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build
        run: |
          tools/in_alpine.sh '
            cmake --preset musl-dev >/dev/null &&
            cmake --build --preset musl-dev --target zet-agent
          '
          agent=$(find build/musl-dev -type f -name zet-agent -perm -u+x | head -1)
          test -n "$agent" || { echo "no zet-agent was built"; exit 1; }
          mkdir -p "$RUNNER_TEMP/agent"
          cp "$agent" "$RUNNER_TEMP/agent/zet-agent"

      - uses: actions/upload-artifact@v4
        with:
          name: zet-agent
          path: ${{ runner.temp }}/agent/zet-agent
          if-no-files-found: error
          retention-days: 1

  macos-e2e:
    name: macos e2e
    needs: [changes, agent]
    if: needs.changes.outputs.macos_e2e == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ccache and apk files live under the home directory, which colima
      # mounts into its VM, so the container sees the same paths.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: macos-e2e-client

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      # The VM images colima and Lima download on first start: the same every
      # run, and a few hundred megabytes of the boot.
      - name: Restore the VM images
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/lima
            ~/Library/Caches/colima
          key: colima-images-${{ runner.os }}-${{ runner.arch }}-v1

      # One step, so that colima is this shell's child: it is installed and
      # started first, the VM boots while LLVM is poured and the client
      # compiles, and `wait` collects its exit status — the readiness check —
      # without polling. Homebrew's LLVM, as the macos job in ci.yml: the
      # project needs Clang 20 or newer, which the runner's Xcode lacks.
      - name: Start colima and build the native client
        run: |
          # pipefail: the background pipeline's status must be colima's.
          set -o pipefail
          stamp() { while IFS= read -r line; do printf '%s %s\n' "$(date +%T)" "$line"; done; }
          brew install colima docker
          colima start --cpu 3 --memory 8 --vm-type vz --mount-type virtiofs \
            2>&1 | stamp > "$RUNNER_TEMP/colima.log" &
          colima=$!
          brew install ninja libsodium llvm ccache
          cmake --preset dev -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++" >/dev/null
          cmake --build --preset dev --target zet
          echo "client built at $(date +%T)"
          status=0
          wait "$colima" || status=$?
          # Always: how long the boot took is the number this job is about.
          cat "$RUNNER_TEMP/colima.log"
          [ "$status" -eq 0 ] || exit 1
          docker version --format 'docker {{.Server.Version}}'

      - uses: actions/download-artifact@v4
        with:
          name: zet-agent
          path: ${{ runner.temp }}/agent

      - name: Start the host
        run: ZET_E2E_AGENT="$RUNNER_TEMP/agent/zet-agent" tools/macos_e2e_host.sh up

      - name: Run the macOS suite
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pytest
          "$RUNNER_TEMP/venv/bin/python" -m pytest -p no:cacheprovider -v tests/macos_e2e

      - name: The host's log
        if: failure()
        run: |
          docker logs zet-e2e-host 2>&1 | tail -80 || true
          docker exec zet-e2e-host cat /src/build/macos-e2e/sshd.log 2>/dev/null | tail -40 || true

      - name: Stop the host
        if: always()
        run: tools/macos_e2e_host.sh down
