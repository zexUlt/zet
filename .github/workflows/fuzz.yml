name: fuzz

# The one-minute smoke run, its own workflow because it is its own cache and
# its own failure. Which pull requests it runs on is tools/ci_changes.sh's
# call, shared with ci.yml and macos-e2e.yml; a path that script does not
# know runs it, so a new directory cannot be skipped by omission.

on:
  # Every pull request, so that `fuzz` can be a required check; the job skips
  # when the change touches nothing a fuzzer builds (tools/ci_changes.sh).
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push supersedes a pull request's run; a trunk commit keeps its
  # own, so that every merge gets a result and the badge never shows a
  # cancelled run as failing.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      fuzz: ${{ steps.changes.outputs.fuzz }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes

  fuzz:
    name: fuzz
    needs: changes
    if: needs.changes.outputs.fuzz == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Instrumented objects match nothing the other jobs built, so the fuzz
      # build gets a cache entry of its own rather than evicting theirs.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-fuzz

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      # A minute per target, which is what catches "does not build" and "dies
      # on the first input" — the two things ET's fuzzers would have caught had
      # anyone ever run them. The ten minutes per target from the M1 criterion
      # are in fuzz-soak.yml, where they do not sit on every pull request.
      - name: Build and run every fuzzer briefly
        run: tools/fuzz_run.sh 60

      # Without the artifact a finding is a red tick and a stack trace: the
      # input that produced it lives only on a runner that is about to be
      # deleted.
      - name: Keep what the fuzzers found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings
          path: build/musl-fuzz/findings/
          if-no-files-found: ignore
