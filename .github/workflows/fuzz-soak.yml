name: fuzz soak (release gate)

# The M1 criterion from docs/design.md §17: every fuzzer, ten minutes, clean.
# Separate from CI on purpose — an hour of fuzzing on every pull request buys
# nothing the one-minute smoke run in fuzz.yml does not already catch, and
# the thing a release needs to know is not answered in sixty seconds either
# way.
#
# Dispatch it with the default of 600 seconds to run the M1 gate; the nightly
# run takes the 30 minutes per target that §17 asks for.

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per fuzzer
        required: false
        default: "600"
  schedule:
    - cron: "0 3 * * *"

# Per ref: a soak of one branch has no reason to wait for another's.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  # The targets, read off the zet_add_fuzzer lines so that the matrix below
  # follows fuzz/CMakeLists.txt with no list of its own. A line the pattern
  # does not take fails here instead of leaving its target out of the soak.
  list:
    name: list fuzzers
    runs-on: ubuntu-24.04
    outputs:
      fuzzers: ${{ steps.list.outputs.fuzzers }}
    steps:
      - uses: actions/checkout@v4

      - name: Read fuzz/CMakeLists.txt
        id: list
        run: |
          file=fuzz/CMakeLists.txt
          calls=$(grep -c '^zet_add_fuzzer(' "$file")
          names=$(sed -n 's/^zet_add_fuzzer(\([a-z0-9_]*\)[ )].*/\1/p' "$file")
          if [ "$calls" -eq 0 ] || [ "$(printf '%s\n' "$names" | grep -c .)" -ne "$calls" ]; then
            echo "read $calls zet_add_fuzzer lines but $(printf '%s\n' "$names" | grep -c .) names:"
            printf '%s\n' "$names"
            exit 2
          fi
          json=$(printf '%s\n' "$names" | jq -R . | jq -sc .)
          echo "fuzzers=$json" >>"$GITHUB_OUTPUT"
          echo "$json"

  # One job per target: the gate is wall time per fuzzer, and run one after
  # another the six of them took an hour at 600 seconds and two and a half at
  # the nightly 1800.
  soak:
    name: soak ${{ matrix.fuzzer }}
    needs: list
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        fuzzer: ${{ fromJSON(needs.list.outputs.fuzzers) }}
    env:
      # Through the environment rather than straight into the run script: a
      # dispatch input is text someone typed, and interpolating it into a shell
      # line is how it becomes a command.
      ZET_FUZZ_SECONDS: ${{ github.event.inputs.seconds || 1800 }}
      ZET_FUZZER: ${{ matrix.fuzzer }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-fuzz

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Soak ${{ matrix.fuzzer }}
        run: |
          case "$ZET_FUZZ_SECONDS" in
            '' | *[!0-9]*)
              echo "seconds must be a whole number, got '$ZET_FUZZ_SECONDS'"
              exit 2
              ;;
          esac
          tools/fuzz_run.sh "$ZET_FUZZ_SECONDS" musl-fuzz "$ZET_FUZZER"

      - name: Keep what the fuzzers found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-soak-findings-${{ matrix.fuzzer }}
          path: build/musl-fuzz/findings/
          if-no-files-found: ignore

      # The corpus the run grew is worth more than the seconds that produced
      # it: the next soak starts from it instead of rediscovering the header
      # layout. It is not committed — only what crashed goes into the tree.
      - name: Keep the corpus the run grew
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-soak-corpus-${{ matrix.fuzzer }}
          path: build/musl-fuzz/work/
          if-no-files-found: ignore
          retention-days: 14

  # The short scenario of §16 at its full size: a cut at every byte offset of
  # 64 KiB, both ways. Every offset is a run of its own, so it costs the
  # square of the size — five minutes here, too much for every pull request,
  # which runs 16 KiB of it.
  reconnect-every-offset:
    name: reconnect at every offset (64 KiB)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Cut at every byte of 64 KiB
        run: |
          tools/in_alpine.sh '
            cmake --preset musl-dev >/dev/null &&
            cmake --build --preset musl-dev &&
            ZET_CUT_SCENARIO_BYTES=65536 ctest --preset musl-dev -R "a cut at every byte"
          '
