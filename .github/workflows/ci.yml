name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ubuntu 24.04 ships Clang 18. The project requires 17 or newer, so the
  # stock package is fine and we avoid depending on apt.llvm.org staying up.
  CC: clang
  CXX: clang++

jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan-ubsan, tsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build cmake

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format

      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.cc' '*.h')
          if [ ${#files[@]} -eq 0 ]; then
            echo "нет C++ файлов"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

  tidy:
    name: clang-tidy (naming)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-tidy ninja-build cmake

      - name: Configure
        run: cmake --preset dev

      - name: Check naming
        run: |
          mapfile -t files < <(git ls-files 'src/*.cpp' 'tests/*.cpp')
          if [ ${#files[@]} -eq 0 ]; then
            echo "нет исходников"
            exit 0
          fi
          clang-tidy -p build/dev --warnings-as-errors='*' "${files[@]}"

  gates:
    name: invariant gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build cmake

      - name: Build
        run: |
          cmake --preset dev
          cmake --build --preset dev

      # Each gate is a script so it runs identically on a laptop. The point of
      # having them in CI is that a violation stops a pull request, not that it
      # is noticed during review.
      - name: No abort in the protocol core
        run: tools/check_no_abort.sh build/dev

      - name: No outbound network calls outside the transport
        run: tools/check_no_telemetry.sh build/dev

      - name: No undeclared dependencies
        run: tools/check_deps.sh

      - name: Binary size budgets
        run: tools/check_binary_size.sh build/dev

      - name: Documentation references
        run: python3 tools/check_refs.py

  gates-self-test:
    name: gates fail when they should
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang ninja-build cmake

      # A gate that cannot fail is decoration. Break each invariant on purpose
      # and require the gate to notice.
      - name: check_no_abort catches a deliberate abort
        run: |
          cmake --preset dev
          sed -i '1i #include <cstdlib>' src/core/byte_writer.cpp
          sed -i 's|const MutableByteSpan slot = out_|if (count == 424242) std::abort();\n    const MutableByteSpan slot = out_|' src/core/byte_writer.cpp
          cmake --build --preset dev
          if tools/check_no_abort.sh build/dev; then
            echo "гейт пропустил std::abort в ядре"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      - name: check_deps catches an undeclared dependency
        run: |
          echo 'find_package(Boost REQUIRED)' >> src/core/CMakeLists.txt
          if tools/check_deps.sh; then
            echo "гейт пропустил незаявленную зависимость"
            exit 1
          fi
          git checkout src/core/CMakeLists.txt
