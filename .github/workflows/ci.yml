name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [dev, asan-ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: ./.github/actions/toolchain

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats

  # The Ubuntu jobs above are the development environment. This one is the
  # shipping environment, and the two differ in libc — so the tests run here as
  # well, against the library the binaries are actually linked with.
  musl:
    name: musl
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl

      - name: Build and test
        run: tools/musl_build.sh musl-dev test

      - name: Build what ships
        run: tools/musl_build.sh musl-release

      - name: Binary size budgets
        run: tools/check_binary_size.sh build/musl-release

  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        uses: ./.github/actions/toolchain

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: dev

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Check formatting
        if: always()
        run: |
          mapfile -t files < <(find src tests -name '*.cpp' -o -name '*.hpp' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "нет C++ файлов"
            exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: Check naming and run the static analyser
        if: always()
        run: |
          # find, not git ls-files: the latter only lists tracked files, so a
          # newly written source would be silently skipped.
          mapfile -t files < <(find src tests -name '*.cpp' | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "нет исходников"
            exit 0
          fi
          clang-tidy -p build/dev --warnings-as-errors='*' "${files[@]}"

      # Each gate is a script so it runs identically on a laptop. The point of
      # having them in CI is that a violation stops a pull request, not that it
      # is noticed during review.
      - name: No abort in the protocol core
        run: tools/check_no_abort.sh build/dev

      - name: No outbound network calls outside the transport
        run: tools/check_no_telemetry.sh build/dev

      - name: No undeclared dependencies
        run: tools/check_deps.sh

      # A gate that cannot fail is decoration. Break each invariant on purpose
      # and require the gate to notice. These come last: they dirty the working
      # tree and rebuild, so anything after them would measure the wrong thing.
      # Инъекция дописывается в конец файла и ни к чему в нём не привязана.
      # Прошлая версия цеплялась за имя члена, переименование сделало sed
      # холостым, и самотест позеленел бы на пустом месте — а сообщение об
      # ошибке обвинило бы гейт. Поэтому теперь сначала проверяем, что
      # инъекция вообще состоялась.
      - name: check_no_abort catches a deliberate abort
        run: |
          printf '\nnamespace zet {\nvoid GateSelfTestCanary() { std::abort(); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          sed -i '1i #include <cstdlib>' src/core/byte_writer.cpp
          if ! grep -q GateSelfTestCanary src/core/byte_writer.cpp; then
            echo "инъекция не применилась — самотест ничего не проверяет"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          cmake --build --preset dev
          if tools/check_no_abort.sh build/dev; then
            echo "гейт пропустил std::abort в ядре"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      - name: check_deps catches an undeclared dependency
        run: |
          test -f src/core/CMakeLists.txt || { echo "цель инъекции переехала"; exit 1; }
          echo 'find_package(Boost REQUIRED)' >> src/core/CMakeLists.txt
          if tools/check_deps.sh; then
            echo "гейт пропустил незаявленную зависимость"
            exit 1
          fi
          git checkout src/core/CMakeLists.txt

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats
