name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [musl-dev, musl-asan-ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build and test
        run: tools/musl_build.sh ${{ matrix.preset }} test

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Its own cache entry: instrumented objects match nothing built for
      # musl-dev, and a shared one would just have the two jobs evict each
      # other.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-coverage

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Line coverage of the protocol core
        env:
          ZET_COVERAGE_MARKDOWN: ${{ runner.temp }}/coverage.md
        run: |
          tools/check_coverage.sh
          cat "$ZET_COVERAGE_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"

      # Updates its own comment rather than leaving one per push; the marker in
      # the body is how it finds it. Runs even when the gate failed — a missed
      # threshold is exactly when the numbers are worth reading.
      - name: Report coverage on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: ${{ runner.temp }}/coverage.md
        run: |
          [ -s "$BODY" ] || exit 0
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- zet-coverage -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$BODY" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
              -F body=@"$BODY" >/dev/null
          fi

      # A threshold of 101 is unreachable by construction, so this self-test
      # will not break on the day coverage honestly reaches 100%.
      - name: check_coverage catches a threshold miss
        run: |
          sed -i 's/^readonly LINE_COVERAGE_THRESHOLD_PERCENT=.*/readonly LINE_COVERAGE_THRESHOLD_PERCENT=101/' \
            tools/check_coverage.sh
          if ! grep -q 'LINE_COVERAGE_THRESHOLD_PERCENT=101' tools/check_coverage.sh; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout tools/check_coverage.sh
            exit 1
          fi
          if tools/check_coverage.sh; then
            echo "the gate passed coverage that is below the threshold"
            exit 1
          fi
          git checkout tools/check_coverage.sh

  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build
        run: tools/musl_build.sh musl-dev

      - name: Check formatting
        if: always()
        run: |
          tools/in_alpine.sh '
            files=$(find src tests -name "*.cpp" -o -name "*.hpp" | sort)
            [ -n "$files" ] || { echo "no C++ files"; exit 0; }
            clang-format --dry-run --Werror $files
          '

      - name: Check naming and run the static analyser
        if: always()
        run: |
          # find, not git ls-files: the latter only lists tracked files, so a
          # newly written source would be silently skipped.
          tools/in_alpine.sh '
            files=$(find src tests -name "*.cpp" | sort)
            [ -n "$files" ] || { echo "no sources"; exit 0; }
            clang-tidy -p build/musl-dev --warnings-as-errors="*" $files
          '

      # Each gate is a script, so it runs identically on a laptop. The point of
      # having them in CI is that a violation stops a pull request, not that it
      # is noticed during review.
      - name: No abort in the protocol core
        run: tools/check_no_abort.sh build/musl-dev

      - name: No outbound network calls outside the transport
        run: tools/check_no_telemetry.sh build/musl-dev

      - name: No undeclared dependencies
        run: tools/check_deps.sh

      - name: Build what ships
        run: tools/musl_build.sh musl-release

      - name: Binary size budgets
        run: tools/check_binary_size.sh build/musl-release

      # A gate that cannot fail is decoration. Break each invariant on purpose
      # and require the gate to notice. These come last: they dirty the working
      # tree and rebuild, so anything after them would measure the wrong thing.
      #
      # The injection is appended at the end of the file and anchored to nothing
      # in it. The previous version keyed on a member name, a rename made the sed
      # a no-op, and the self-test would have gone green on nothing — while the
      # error message blamed the gate. Hence the check that it applied at all.
      - name: check_no_abort catches a deliberate abort
        run: |
          printf '\nnamespace zet {\nvoid GateSelfTestCanary() { std::abort(); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          sed -i '1i #include <cstdlib>' src/core/byte_writer.cpp
          if ! grep -q GateSelfTestCanary src/core/byte_writer.cpp; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          tools/musl_build.sh musl-dev
          if tools/check_no_abort.sh build/musl-dev; then
            echo "the gate passed a std::abort in the core"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      - name: check_deps catches an undeclared dependency
        run: |
          test -f src/core/CMakeLists.txt || { echo "the injection target moved"; exit 1; }
          echo 'find_package(Boost REQUIRED)' >> src/core/CMakeLists.txt
          if tools/check_deps.sh; then
            echo "the gate passed an undeclared dependency"
            exit 1
          fi
          git checkout src/core/CMakeLists.txt
