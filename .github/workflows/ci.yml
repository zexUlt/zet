name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  test:
    name: test (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [musl-dev, musl-asan-ubsan]
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build and test
        run: tools/musl_build.sh ${{ matrix.preset }} test

  coverage:
    name: coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Своя запись кеша: инструментированные объекты не совпадают ни с одним
      # объектом из musl-dev, и общий кеш обе джобы только вытеснял бы.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-coverage

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Line coverage of the protocol core
        run: tools/check_coverage.sh

      # Порог 101 недостижим по построению, поэтому самотест не сломается в тот
      # день, когда покрытие честно дойдёт до 100%.
      - name: check_coverage catches a threshold miss
        run: |
          sed -i 's/^readonly LINE_COVERAGE_THRESHOLD_PERCENT=.*/readonly LINE_COVERAGE_THRESHOLD_PERCENT=101/' \
            tools/check_coverage.sh
          if ! grep -q 'LINE_COVERAGE_THRESHOLD_PERCENT=101' tools/check_coverage.sh; then
            echo "инъекция не применилась — самотест ничего не проверяет"
            git checkout tools/check_coverage.sh
            exit 1
          fi
          if tools/check_coverage.sh; then
            echo "гейт пропустил покрытие ниже порога"
            exit 1
          fi
          git checkout tools/check_coverage.sh

  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build
        run: tools/musl_build.sh musl-dev

      - name: Check formatting
        if: always()
        run: |
          tools/in_alpine.sh '
            files=$(find src tests -name "*.cpp" -o -name "*.hpp" | sort)
            [ -n "$files" ] || { echo "нет C++ файлов"; exit 0; }
            clang-format --dry-run --Werror $files
          '

      - name: Check naming and run the static analyser
        if: always()
        run: |
          # find, а не git ls-files: последний перечисляет только отслеживаемые
          # файлы, и свеженаписанный исходник молча остался бы непроверенным.
          tools/in_alpine.sh '
            files=$(find src tests -name "*.cpp" | sort)
            [ -n "$files" ] || { echo "нет исходников"; exit 0; }
            clang-tidy -p build/musl-dev --warnings-as-errors="*" $files
          '

      # Гейты — скрипты, поэтому на ноутбуке они запускаются той же командой.
      # Смысл их присутствия в CI в том, что нарушение останавливает pull
      # request, а не в том, что его заметят на ревью.
      - name: No abort in the protocol core
        run: tools/check_no_abort.sh build/musl-dev

      - name: No outbound network calls outside the transport
        run: tools/check_no_telemetry.sh build/musl-dev

      - name: No undeclared dependencies
        run: tools/check_deps.sh

      - name: Build what ships
        run: tools/musl_build.sh musl-release

      - name: Binary size budgets
        run: tools/check_binary_size.sh build/musl-release

      # Гейт, который не может упасть, — украшение. Ломаем инвариант нарочно и
      # требуем, чтобы гейт это заметил. Идёт последним: пачкает рабочее дерево
      # и пересобирает, поэтому всё после него мерило бы не то.
      #
      # Инъекция дописывается в конец файла и ни к чему в нём не привязана.
      # Прошлая версия цеплялась за имя члена, переименование сделало sed
      # холостым, и самотест позеленел бы на пустом месте — а сообщение об
      # ошибке обвинило бы гейт. Поэтому сначала проверяем, что инъекция
      # вообще состоялась.
      - name: check_no_abort catches a deliberate abort
        run: |
          printf '\nnamespace zet {\nvoid GateSelfTestCanary() { std::abort(); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          sed -i '1i #include <cstdlib>' src/core/byte_writer.cpp
          if ! grep -q GateSelfTestCanary src/core/byte_writer.cpp; then
            echo "инъекция не применилась — самотест ничего не проверяет"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          tools/musl_build.sh musl-dev
          if tools/check_no_abort.sh build/musl-dev; then
            echo "гейт пропустил std::abort в ядре"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      - name: check_deps catches an undeclared dependency
        run: |
          test -f src/core/CMakeLists.txt || { echo "цель инъекции переехала"; exit 1; }
          echo 'find_package(Boost REQUIRED)' >> src/core/CMakeLists.txt
          if tools/check_deps.sh; then
            echo "гейт пропустил незаявленную зависимость"
            exit 1
          fi
          git checkout src/core/CMakeLists.txt
