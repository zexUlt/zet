name: CI

on:
  pull_request:
  push:
    branches: [trunk]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZET_APK_CACHE: ${{ github.workspace }}/../apk-cache

jobs:
  # Which jobs this change needs (tools/ci_changes.sh). A job that is not
  # needed skips rather than the workflow filtering by path: the jobs below
  # are required checks, a workflow that never runs leaves them missing and
  # the pull request unmergeable, and a skipped job counts as passed. Pushes
  # to trunk run everything.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      test: ${{ steps.changes.outputs.test }}
      integration: ${{ steps.changes.outputs.integration }}
      coverage: ${{ steps.changes.outputs.coverage }}
      checks: ${{ steps.changes.outputs.checks }}
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes

  test:
    name: test (${{ matrix.preset }})
    needs: changes
    # Not skipped at the job level: a skipped matrix job is never expanded,
    # so the required "test (musl-dev)" and "test (musl-asan-ubsan)" would
    # wait for ever. The job runs and its steps skip instead.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [musl-dev, musl-asan-ubsan]
    env:
      NEEDED: ${{ needs.changes.outputs.test }}
    steps:
      - uses: actions/checkout@v4
        if: env.NEEDED == 'true'

      - name: Restore the compiler cache
        if: env.NEEDED == 'true'
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Restore the Alpine packages
        if: env.NEEDED == 'true'
        uses: ./.github/actions/apk

      - name: Build and test
        if: env.NEEDED == 'true'
        run: tools/musl_build.sh ${{ matrix.preset }} test

  # design.md §16: a real sshd on localhost, a real pty, iptables for
  # half-open cuts. Its own container flags (NET_ADMIN) and package list, so
  # the other jobs stay as they are.
  integration:
    name: integration (${{ matrix.preset }})
    needs: changes
    # Steps skip, not the job: a skipped matrix job never expands into the
    # names a required check waits for (see test above).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [musl-dev, musl-asan-ubsan]
    env:
      NEEDED: ${{ needs.changes.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        if: env.NEEDED == 'true'

      - name: Restore the compiler cache
        if: env.NEEDED == 'true'
        uses: ./.github/actions/ccache
        with:
          key: ${{ matrix.preset }}

      - name: Restore the Alpine packages
        if: env.NEEDED == 'true'
        uses: ./.github/actions/apk

      - name: Build and run the integration suite
        if: env.NEEDED == 'true'
        run: tools/integration.sh ${{ matrix.preset }} -rs

  coverage:
    name: coverage
    needs: changes
    if: needs.changes.outputs.coverage == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      # Its own cache entry: instrumented objects match nothing built for
      # musl-dev, and a shared one would just have the two jobs evict each
      # other.
      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-coverage

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Line coverage of the protocol core
        run: |
          tools/check_coverage.sh
          cat build/musl-coverage/coverage.md >> "$GITHUB_STEP_SUMMARY"

      # Updates its own comment rather than leaving one per push; the marker in
      # the body is how it finds it. Runs even when the gate failed — a missed
      # threshold is exactly when the numbers are worth reading.
      - name: Report coverage on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: build/musl-coverage/coverage.md
        run: |
          [ -s "$BODY" ] || exit 0
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq '.[] | select(.body | startswith("<!-- zet-coverage -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$BODY" >/dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
              -F body=@"$BODY" >/dev/null
          fi

      # A threshold of 101 is unreachable by construction, so this self-test
      # will not break on the day coverage honestly reaches 100%.
      - name: check_coverage catches a threshold miss
        run: |
          sed -i 's/^readonly LINE_COVERAGE_THRESHOLD_PERCENT=.*/readonly LINE_COVERAGE_THRESHOLD_PERCENT=101/' \
            tools/check_coverage.sh
          if ! grep -q 'LINE_COVERAGE_THRESHOLD_PERCENT=101' tools/check_coverage.sh; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout tools/check_coverage.sh
            exit 1
          fi
          if tools/check_coverage.sh; then
            echo "the gate passed coverage that is below the threshold"
            exit 1
          fi
          git checkout tools/check_coverage.sh

  # The checks, side by side. Each gate is a script, so it runs identically on
  # a laptop; the point of having them in CI is that a violation stops a pull
  # request, not that it is noticed during review. A gate that cannot fail is
  # decoration, so each is also broken on purpose and required to notice —
  # those self-tests dirty the tree and rebuild, which is why each has a job
  # of its own instead of running after the others.
  format:
    name: format
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Check formatting
        run: |
          tools/in_alpine.sh '
            files=$(find src tests fuzz -name "*.cpp" -o -name "*.hpp" | sort)
            [ -n "$files" ] || { echo "no C++ files"; exit 0; }
            clang-format --dry-run --Werror $files
          '

  tidy:
    name: tidy
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Check naming and run the static analyser
        run: |
          # A configured tree is enough: the compile database and the
          # generated headers come from cmake, not from the build. find, not
          # git ls-files: the latter only lists tracked files, so a newly
          # written source would be silently skipped. The macOS-only backend
          # is left to the macos job: Linux has no sys/event.h.
          tools/in_alpine.sh '
            cmake --preset musl-dev >/dev/null &&
            files=$(find src tests -name "*.cpp" ! -name "*_kqueue.cpp" | sort)
            [ -n "$files" ] || { echo "no sources"; exit 0; }
            clang-tidy -p build/musl-dev --warnings-as-errors="*" $files
          '


  gates:
    name: gates
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build
        run: tools/musl_build.sh musl-dev

      - name: No abort in the protocol core
        run: tools/check_no_abort.sh build/musl-dev

      - name: No outbound network calls outside the transport
        run: tools/check_no_telemetry.sh build/musl-dev

  # The gates that read the source rather than a build, with their self-tests.
  grep-gates:
    name: grep gates
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Nothing sleeps
        run: tools/check_no_sleep.sh

      - name: The CI change filter answers its table
        run: tools/ci_changes_test.sh

      - name: The client's path builds on Linux and macOS
        run: tools/check_portable.sh

      - name: No undeclared dependencies
        run: tools/check_deps.sh

      - name: check_no_sleep catches a deliberate sleep
        run: |
          printf '\nnamespace zet {\nvoid GateSelfTestNap() { std::this_thread::sleep_for(std::chrono::seconds{1}); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          if ! grep -q GateSelfTestNap src/core/byte_writer.cpp; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          if tools/check_no_sleep.sh; then
            echo "the gate passed a sleep_for in the core"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      - name: check_portable catches a Linux-only call on the client's path
        run: |
          # After a block comment on the same line: a gate that dropped the
          # whole line with the comment would miss it.
          printf '\nnamespace zet {\n/* not here */ int GateSelfTestLinuxOnly() { return SOCK_NONBLOCK; }\n}  // namespace zet\n' \
            >> src/io/tcp.cpp
          if ! grep -q GateSelfTestLinuxOnly src/io/tcp.cpp; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout src/io/tcp.cpp
            exit 1
          fi
          if tools/check_portable.sh; then
            echo "the gate passed SOCK_NONBLOCK on the client's path"
            exit 1
          fi
          git checkout src/io/tcp.cpp

      - name: check_deps catches an undeclared dependency
        run: |
          test -f src/core/CMakeLists.txt || { echo "the injection target moved"; exit 1; }
          echo 'find_package(Boost REQUIRED)' >> src/core/CMakeLists.txt
          if tools/check_deps.sh; then
            echo "the gate passed an undeclared dependency"
            exit 1
          fi
          git checkout src/core/CMakeLists.txt

      # The compile-fail tests pass only on the diagnostic each one expects, so
      # breaking one means making its forbidden line legal. Opening every
      # private member of the file does that while anchored to no name in it.
      # Build and test run separately: a build that failed for some other
      # reason must not count as the test having noticed.

  size:
    name: size
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-release

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build what ships
        run: tools/musl_build.sh musl-release

      - name: Binary size budgets
        run: tools/check_binary_size.sh build/musl-release

      - name: Stage the stripped agent (x86_64)
        run: |
          agent=$(find build/musl-release -type f -name zet-agent -perm -u+x | head -1)
          test -n "$agent" || { echo "no zet-agent was built"; exit 1; }
          mkdir -p "$RUNNER_TEMP/agent-x86_64"
          cp "$agent" "$RUNNER_TEMP/agent-x86_64/zet-agent"

      - uses: actions/upload-artifact@v4
        with:
          name: zet-agent-x86_64
          path: ${{ runner.temp }}/agent-x86_64/zet-agent
          if-no-files-found: error
          retention-days: 7

  # The injection is appended at the end of the file and anchored to nothing
  # in it. The previous version keyed on a member name, a rename made the sed
  # a no-op, and the self-test would have gone green on nothing — while the
  # error message blamed the gate. Hence the check that it applied at all.
  self-test-abort:
    name: self-test (abort)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: check_no_abort catches a deliberate abort
        run: |
          printf '\nnamespace zet {\nvoid GateSelfTestCanary() { std::abort(); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          sed -i '1i #include <cstdlib>' src/core/byte_writer.cpp
          if ! grep -q GateSelfTestCanary src/core/byte_writer.cpp; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          tools/musl_build.sh musl-dev
          if tools/check_no_abort.sh build/musl-dev; then
            echo "the gate passed a std::abort in the core"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

      # The same gate, broken the way a header breaks it: no abort in sight,
      # just std::get, which under -fno-exceptions libc++ turns into a call to
      # __libcpp_verbose_abort. Appended like the canary above, for the same
      # reason, and checked for having applied.

  # The same gate, broken the way a header breaks it: no abort in sight, just
  # std::get, which under -fno-exceptions libc++ turns into a call to
  # __libcpp_verbose_abort.
  self-test-get:
    name: self-test (std::get)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: check_no_abort catches abort hidden in a standard header
        run: |
          printf '\nnamespace zet {\nint GateSelfTestVariant(const std::variant<int, long>& v) { return std::get<int>(v); }\n}  // namespace zet\n' \
            >> src/core/byte_writer.cpp
          sed -i '1i #include <variant>' src/core/byte_writer.cpp
          if ! grep -q GateSelfTestVariant src/core/byte_writer.cpp; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout src/core/byte_writer.cpp
            exit 1
          fi
          tools/musl_build.sh musl-dev
          if tools/check_no_abort.sh build/musl-dev; then
            echo "the gate passed a std::get that can end the process"
            exit 1
          fi
          git checkout src/core/byte_writer.cpp

  # The compile-fail tests pass only on the diagnostic each one expects, so
  # breaking one means making its forbidden line legal. Opening every private
  # member of the file does that while anchored to no name in it. Build and
  # test run separately: a build that failed for some other reason must not
  # count as the test having noticed.
  self-test-compile-fail:
    name: self-test (compile-fail)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      - name: Build
        run: tools/musl_build.sh musl-dev

      - name: compile-fail tests catch an opened door
        run: |
          target=tests/compile_fail/handle_from_nowhere.cpp
          test -f "$target" || { echo "the injection target moved"; exit 1; }
          { printf '#pragma clang diagnostic ignored "-Wkeyword-macro"\n#define private public\n'
            cat "$target"; } > "$target.new"
          mv "$target.new" "$target"
          if ! grep -q '^#define private public$' "$target"; then
            echo "the injection did not apply — this self-test checks nothing"
            git checkout "$target"
            exit 1
          fi
          tools/in_alpine.sh 'cmake --build --preset musl-dev'
          if tools/in_alpine.sh 'ctest --preset musl-dev -R "^compile_fail\.handle_from_nowhere$"'; then
            echo "the compile-fail test passed a SessionHandle anyone can build"
            exit 1
          fi
          git checkout "$target"

  # The required check: all of the above passed, or the change needed none of
  # them. Branch protection names this one job, so splitting the checks did
  # not change what protects trunk.
  checks:
    name: checks
    needs: [changes, format, tidy, gates, grep-gates, size, self-test-abort, self-test-get, self-test-compile-fail]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every check passed or was not needed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "a check ended $result"; exit 1 ;;
            esac
          done

  # The client on macOS (design.md §12): the kqueue Poller, the portable part
  # of zet_io and the client itself, built and tested natively. The agent is
  # Linux-only and is not built here; end to end the macOS client is tested
  # against a Linux agent by its own job.
  macos:
    name: macos
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: brew install libsodium ninja llvm

      # Homebrew's LLVM rather than the runner's Xcode: macos-14 ships Apple
      # clang 15, and zet needs clang 20 or newer (CMakeLists.txt).
      - name: Build and test
        run: |
          cmake --preset dev -DCMAKE_CXX_COMPILER="$(brew --prefix llvm)/bin/clang++"
          cmake --build --preset dev
          ctest --preset dev

      # The Linux job skips the kqueue backend, which Linux cannot compile; its
      # names are checked here instead, with Homebrew's clang-tidy.
      - name: Check naming in the macOS-only sources
        run: |
          # Homebrew's clang does not know Apple's SDK by itself.
          "$(brew --prefix llvm)/bin/clang-tidy" -p build/dev --warnings-as-errors="*" \
            --extra-arg="-isysroot$(xcrun --show-sdk-path)" \
            src/io/poller_kqueue.cpp

  # The release agent on aarch64: the same musl-dev test run and size gate as
  # the x86_64 jobs, natively on GitHub's free ARM runner, no qemu. Alpine
  # arm64 images and packages install from the same cached .apk files as the
  # x86_64 jobs; the runner.arch segment in the cache key keeps the two
  # package sets apart.
  agent-aarch64:
    name: agent (aarch64)
    needs: changes
    if: needs.changes.outputs.checks == 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Restore the compiler cache
        uses: ./.github/actions/ccache
        with:
          key: musl-dev

      - name: Restore the Alpine packages
        uses: ./.github/actions/apk

      # Tests first: the release binary is only worth uploading if the
      # debug+test build is clean. musl-asan-ubsan is skipped — ASan on
      # aarch64 musl can crash the sanitizer runtime itself on this runner
      # image; musl-dev is the meaningful signal.
      - name: Build and test
        run: tools/musl_build.sh musl-dev test

      - name: Build what ships
        run: tools/musl_build.sh musl-release

      # The same budgets as x86_64: aarch64 binaries are in the same ballpark.
      # A failure here means the budget needs a conscious decision, not a
      # silent bump (design.md §14).
      - name: Binary size budgets
        run: tools/check_binary_size.sh build/musl-release

      - name: Stage the stripped agent (aarch64)
        run: |
          agent=$(find build/musl-release -type f -name zet-agent -perm -u+x | head -1)
          test -n "$agent" || { echo "no zet-agent was built"; exit 1; }
          mkdir -p "$RUNNER_TEMP/agent-aarch64"
          cp "$agent" "$RUNNER_TEMP/agent-aarch64/zet-agent"

      - uses: actions/upload-artifact@v4
        with:
          name: zet-agent-aarch64
          path: ${{ runner.temp }}/agent-aarch64/zet-agent
          if-no-files-found: error
          retention-days: 7
