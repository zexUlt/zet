name: Alpine packages
description: Восстанавливает кеш .apk, из которого ставится тулчейн.

# Кешируются пакеты, а не образ: базовый alpine весит 3.5 МБ, а установка из
# тёплого кеша занимает десять секунд и не ходит в сеть. Ключ — хеш списка
# пакетов и скрипта запуска, поэтому правка любого из них обновляет кеш сама.

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/../apk-cache
        key: apk-${{ runner.os }}-${{ hashFiles('tools/alpine-packages.txt', 'tools/in_alpine.sh') }}
