[pytest]
# A test that hangs dumps the Python stacks of every thread to stderr after
# this many seconds, and the run goes on: the traceback is for the CI log,
# the job's own timeout still ends a hang. pytest's own option, so no plugin.
# The slowest passing test takes about 130 s under load (the cut tests), so
# this is a hang, not a slow run.
faulthandler_timeout = 600
