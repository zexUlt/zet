# Known differences between zet_grid and pyte.
#
# Each entry has:
#   file:   stem of the .bin file, or '*' for all files
#   row:    0-based row index, or -1 for cursor-position differences
#   reason: why the difference is expected / acceptable
#
# Add entries here when zet_grid intentionally diverges from pyte and the
# divergence has been verified to be correct (i.e. pyte is wrong or the
# behaviour is undefined by the standard).

# scroll_region: pyte does not implement SU (CSI Ps S) or SD (CSI Ps T)
# within scroll regions — it leaves the written lines in place.  zet applies
# SU 3 then SD 2 (net: SD 1) correctly, shifting content down by one and
# inserting two blank lines at the top of the region.
# Affected rows: 2-19 (entire scroll region) and cursor position.
- file: scroll_region
  row: 2
  reason: pyte ignores SU/SD; zet correctly applies scroll-up then scroll-down within the DECSTBM region
- file: scroll_region
  row: 3
  reason: pyte ignores SU/SD; zet correctly applies scroll-up then scroll-down within the DECSTBM region
